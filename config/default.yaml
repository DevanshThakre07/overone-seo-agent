crawl:
  max_pages: 50
  max_depth: 3
  timeout_seconds: 15
  concurrency: 5
  delay_seconds: 0.25
  user_agent: "SEO-Agent/0.1 (+https://github.com/local/seo-agent)"
  respect_robots: true
  max_redirects: 5
  same_host_only: true
  check_external_links: true
  max_external_link_checks: 100

playwright:
  # Prefer enabled=true for JS sites. SPA shells also auto-trigger when installed.
  # wait_until uses domcontentloaded; content selectors + settle handle hydration.
  enabled: true
  timeout_ms: 45000
  wait_until: "domcontentloaded"

analyzer:
  page_size_threshold_bytes: 3145728  # 3 MB
  scoring:
    base_score: 100
    weights:
      critical: 8
      warning: 3
      info: 1
    # Page-level issues are scored by prevalence (share of crawled pages
    # affected), not raw occurrence count, and the total is capped so a large
    # crawl cannot drive the score to 0 by volume alone.
    prevalence_scale: 3.0
    max_page_level_penalty: 60.0
    # Crawls smaller than this fall back to flat per-issue weighting, because
    # prevalence is meaningless when every finding covers 100% of one page.
    min_pages_for_prevalence: 5

storage:
  backend: sqlite
  path: data/audits.db

llm:
  provider: openai_compatible
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  temperature: 0.3
  timeout_seconds: 60
  optimize_max_pages: 5

logging:
  level: INFO
  json_logs: true

# Google Search Console — product-owner OAuth client (customers connect later).
gsc:
  enabled: true
  client_secrets_file: secrets/google-oauth-client.json
  redirect_uri: http://localhost:8000/auth/callback
  token_db_path: data/gsc_tokens.db
  # Mirror of Google Cloud OAuth consent Publishing status (owner-declared).
  # testing | production | unspecified
  oauth_publishing_status: testing
  # privacy_policy_url / homepage_url — set via GSC_PRIVACY_POLICY_URL / GSC_HOMEPAGE_URL

# PageSpeed Insights — Core Web Vitals / Lighthouse (API key, no OAuth).
pagespeed:
  enabled: true
  # Set via GOOGLE_PAGESPEED_API_KEY in .env
  # Default mobile: Google ranking/CWV are mobile-first; `both` ~2x PSI time/quota.
  # Use strategy desktop|both only for deep checks (API/Hermes), not every audit.
  strategy: mobile  # mobile | desktop | both
  timeout_seconds: 90
  performance_score_warn: 50
  lcp_good_ms: 2500
  cls_good: 0.1
  inp_good_ms: 200

# Keyword research — DataForSEO Keywords Data (volume / CPC / competition).
keywords:
  enabled: true
  # provider/login/password via KEYWORD_API_* in .env
  location_code: 2840  # United States
  language_code: en
  timeout_seconds: 60
  max_keywords_per_request: 100
  # Labs: difficulty + related ideas (same credentials)
  labs_enabled: true
  related_depth: 1
  related_limit: 10
  include_related_in_research: true
