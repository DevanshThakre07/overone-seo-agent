[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-agent"
version = "0.1.0"
description = "Standalone AI SEO Engine — crawl, analyze, optimize, report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "responses>=0.25",
]
playwright = [
    "playwright>=1.40",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
seo-audit = "app.main:main"
seo-optimize = "app.main:optimize_main"
seo-report = "app.main:report_main"
seo-history = "app.main:history_main"
seo-compare = "app.main:compare_main"
seo-api = "app.api.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
